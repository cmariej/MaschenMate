```yaml
name: Deploy Angular frontend to GitHub Pages

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Set API URL
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          node --input-type=module -e "
            import { writeFileSync } from 'node:fs';

            const value = process.env.API_URL;

            if (!value) {
              throw new Error(
                'Set the GitHub Actions repository variable API_URL to your HTTPS API origin.'
              );
            }

            const url = new URL(value);

            if (url.protocol !== 'https:') {
              throw new Error('API_URL must use HTTPS.');
            }

            writeFileSync(
              'frontend/public/app-config.js',
              'window.MASCHENMATE_CONFIG = { apiUrl: ' +
                JSON.stringify(url.origin) +
                ' };\\n'
            );

            console.log('API configuration created successfully.');
          "

      - name: Build Angular frontend
        run: npm run build --workspace=frontend -- --base-href /

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
```
